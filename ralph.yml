# OneInbox Reviews - Issue Queue Workflow
#
# Processes Linear issues from .agent/issue-queue.md one by one.
# Each issue: implement → commit → push → update Linear → next
#
# Usage:
#   ralph run                    # Start processing issues
#   ralph run -p "Start with ONE-40"  # Start with specific issue
#   ralph resume                 # Resume if interrupted

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "ALL_ISSUES_COMPLETE"
  max_iterations: 150
  max_runtime_seconds: 28800  # 8 hours
  checkpoint_interval: 3
  idle_timeout_secs: 600

cli:
  backend: "claude"
  prompt_mode: "argument"

core:
  scratchpad: ".agent/scratchpad.md"
  specs_dir: "./specs/"
  guardrails:
    - "Next.js 16 App Router with TypeScript, Drizzle ORM, NextAuth.js, DodoPayments, Tailwind + shadcn"
    - "Commit format: feat/fix/chore/perf/security/test/ci(ONE-XX): Description"
    - "After each issue: commit, push to main, update Linear to Done with summary comment"
    - "Always run validation before commit: pnpm typecheck && pnpm lint && pnpm build"

hats:
  issue-picker:
    name: "Issue Picker"
    description: "Selects the next issue from the queue"
    triggers: ["start", "issue.complete"]
    publishes: ["issue.selected", "queue.empty"]
    default_publishes: "issue.selected"
    instructions: |
      ## ISSUE PICKER MODE

      Select the next issue to work on from the queue.

      ### Process
      1. Read `.agent/issue-queue.md`
      2. Find the first issue marked `[ ]` (not done)
      3. If found, publish `<event topic="issue.selected">` with issue ID
      4. If no issues remain, publish `<event topic="queue.empty">`

      ### Event Format
      ```
      <event topic="issue.selected">
      issue: ONE-XX
      title: Issue title here
      priority: High/Medium/Low
      </event>
      ```

      ### DON'T
      - Skip issues (process in order)
      - Start implementing (just select)

  implementer:
    name: "Implementer"
    description: "Implements the selected issue"
    triggers: ["issue.selected"]
    publishes: ["impl.done", "impl.blocked"]
    default_publishes: "impl.done"
    instructions: |
      ## IMPLEMENTER MODE

      Implement the issue that was just selected.

      ### Process
      1. Read the issue details from Linear or `.agent/issue-queue.md`
      2. Explore the codebase to understand context
      3. Implement the solution following existing patterns
      4. Run validation: `pnpm typecheck && pnpm lint && pnpm build`
      5. Commit with message: `feat(ONE-XX): Description`
      6. Push to main: `git push origin main`
      7. Publish `<event topic="impl.done">` with summary

      ### Event Format
      ```
      <event topic="impl.done">
      issue: ONE-XX
      files_changed: 5
      summary: Brief description of what was done
      </event>
      ```

      ### Validation Commands
      ```bash
      pnpm typecheck && pnpm lint && pnpm build
      ```

      ### STUCK?
      If blocked, publish `<event topic="impl.blocked">` with what you tried.

      ### DON'T
      - Skip validation
      - Forget to push
      - Work on multiple issues at once

  linear-updater:
    name: "Linear Updater"
    description: "Updates Linear issue status and marks queue item done"
    triggers: ["impl.done"]
    publishes: ["issue.complete"]
    default_publishes: "issue.complete"
    instructions: |
      ## LINEAR UPDATER MODE

      Update Linear and mark the issue complete in the queue.

      ### Process
      1. Update Linear issue to "Done" status using mcp__linear__update_issue
      2. Add a comment summarizing the implementation using mcp__linear__create_comment
      3. Mark the issue as `[x]` in `.agent/issue-queue.md`
      4. Publish `<event topic="issue.complete">`

      ### Event Format
      ```
      <event topic="issue.complete">
      issue: ONE-XX
      linear_updated: true
      </event>
      ```

      ### DON'T
      - Skip the Linear update
      - Forget to mark queue item done

  completer:
    name: "Completer"
    description: "Signals all issues are done"
    triggers: ["queue.empty"]
    publishes: []
    instructions: |
      ## COMPLETER MODE

      All issues have been processed. Time to finish.

      ### Process
      1. Verify `.agent/issue-queue.md` has all items marked `[x]`
      2. Output the completion promise: ALL_ISSUES_COMPLETE

      ### Output
      ```
      ALL_ISSUES_COMPLETE

      Summary:
      - Total issues processed: X
      - All commits pushed to main
      - All Linear issues updated to Done
      ```
